<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>𓆩♚𓆪 صالة ألعاب العمالقة الكبرى الـ 30 𓆩♚𓆪</title>
    
    <!-- 📡 الصب الجبري لمكتبة تليجرام الرسمية الصحيحة 100% في الرأس -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
        body {
            background: radial-gradient(circle, #15002a 0%, #050014 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 400px; }
        .header h1 { font-size: 22px; color: #ffd700; text-shadow: 0 0 12px #ffd700; margin-bottom: 5px; }
        .header p { font-size: 13px; color: #00ffff; text-shadow: 0 0 8px #00ffff; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 400px; margin-bottom: 20px; }
        .game-card {
            background: linear-gradient(135deg, #2b0054 0%, #15002a 100%);
            border: 2px solid #ff007f; border-radius: 12px; padding: 15px;
            text-align: center; font-size: 14px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px #ff007f; transition: all 0.1s ease;
        }
        .game-card:active { transform: scale(0.95); box-shadow: 0 0 4px #ff007f; }
        .arena-zone {
            display: none; width: 100%; max-width: 360px; background: #0d0022;
            border: 3px solid #00ffff; border-radius: 16px; box-shadow: 0 0 20px #00ffff;
            padding: 20px; text-align: center; position: relative;
        }
        .back-btn { background: #ff3333; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        .game-panel-interactive { font-size: 50px; margin: 20px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .action-btn {
            background: linear-gradient(to bottom, #00ffcc 0%, #00b399 100%);
            border: none; border-radius: 25px; color: #000; font-size: 18px; font-weight: bold;
            padding: 12px 30px; cursor: pointer; box-shadow: 0 0 15px #00ffcc; margin-top: 10px;
        }
        .score-board { font-size: 16px; margin-top: 10px; color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <!-- الشاشة الافتتاحية للمشغلين -->
    <div id="main_lobby">
        <div class="header">
            <h1>𓆩♚𓆪 صَالَةُ أَلْعَابِ العَمَالِقَةِ الـ 30 𓆩♚𓆪</h1>
            <p>المشغل الحالي: <span id="user_tag" style="color: #ffd700; font-weight: bold;">جاري لقط الهوية...</span></p>
        </div>
        <div class="games-grid" id="grid_container"></div>
    </div>

    <!-- غرفة العمليات ولعب الجولة باللمس -->
    <div class="arena-zone" id="game_arena">
        <h2 id="active_game_title" style="color: #ffd700; text-shadow: 0 0 8px #ffd700;">اسم اللعبة</h2>
        <div class="game-panel-interactive" id="display_box">🕹️</div>
        <button class="action-btn" id="action_trigger_btn" onclick="playActiveGameRound()">اِبدأ اللعب الحين ⚡</button>
        <div id="score_display" class="score-board"></div>
        <button class="back-btn" onclick="exitToLobbyMenu()">↩️ انسحاب وعودة للقائمة</button>
    </div>
    <script>
        // تهيئة المحرك والـ SDK حياً فوراً الحين
        const WebApp = window.Telegram.WebApp;
        WebApp.ready(); 
        WebApp.expand(); 

        // سحب وتأمين الهوية الرقمية
        let final_user_id = "8813635835"; 
        let final_user_name = "قائد الإمبراطورية";

        if (WebApp.initDataUnsafe && WebApp.initDataUnsafe.user) {
            const tgUser = WebApp.initDataUnsafe.user;
            final_user_id = String(tgUser.id);
            final_user_name = tgUser.username ? `@${tgUser.username}` : tgUser.first_name;
        }
        
        // طباعة الاسم وسحق غيبوبة جاري لقط الهوية
        document.getElementById("user_tag").innerText = final_user_name;

        // مصفوفة جرف وفرش الـ 30 لعبة بالكامل
        const list_of_games = [
            { id: 1, name: "🎰 1. ماكينة الحظ الملكية", icon: "🎰", type: "slots" },
            { id: 2, name: "🎯 2. قناص ضربات الجزاء", icon: "⚽", type: "penalty" },
            { id: 3, name: "🎲 3. حجر النرد الملكي", icon: "🎲", type: "dice" },
            { id: 4, name: "🏀 4. سلة المحترفين", icon: "🏀", type: "basketball" },
            { id: 5, name: "🎯 5. سهم السنتر المضيء", icon: "🎯", type: "darts" },
            { id: 6, name: "💎 6. كبسولة الرصيد الطائر", icon: "💎", type: "clicker" },
            { id: 7, name: "🪨 7. حجر ورقة مقص P2P", icon: "🪨", type: "rps" },
            { id: 8, name: "🃏 8. كارت الحظ العالي P2P", icon: "🃏", type: "cards" },
            { id: 9, name: "🔢 9. خمن الرقم السري P2P", icon: "🔢", type: "guess" },
            { id: 10, name: "🎡 10. عجلة الحظ الدوارة", icon: "🎡", type: "wheel" },
            { id: 11, name: "🪙 11. تدوير العملة لايف", icon: "🪙", type: "coin" },
            { id: 12, name: "🛒 12. مخرطة الحساب السريع", icon: "🛒", type: "math" },
            { id: 13, name: "🔮 13. البلورة السحرية", icon: "🔮", type: "crystal" },
            { id: 14, name: "🧠 14. بنك أسئلة العمالقة", icon: "🧠", type: "quiz" },
            { id: 15, name: "🧩 15. لغز الكلمات المتقاطعة", icon: "🧩", type: "word" },
            { id: 16, name: "⏳ 16. قنبلة الوقت التنازلية", icon: "⏳", type: "bomb" },
            { id: 17, name: "🌍 17. عواصم وجغرافيا العالم", icon: "🌍", type: "geo" },
            { id: 18, name: "📜 18. كاشف الأمثال الشعبية", icon: "📜", type: "proverb" },
            { id: 19, name: "💡 19. رادار العباقرة التفاعلي", icon: "💡", type: "iq" },
            { id: 20, name: "🎁 20. صندوق الهدية اليومية", icon: "🎁", type: "gift" },
            { id: 21, name: "🔍 21. اصطياد الكلمة المفقودة", icon: "🔍", type: "hunt" },
            { id: 22, name: "🏃 22. سباق المشغلين السريع", icon: "🏃", type: "race" },
            { id: 23, name: "🏴 23. أعلام ودول الساحة", icon: "🏴", type: "flag" },
            { id: 24, name: "🪐 24. رحلة الفضاء الرقمية", icon: "🪐", type: "space" },
            { id: 25, name: "🥊 25. مصارعة التحدي صامت", icon: "🥊", type: "box" },
            { id: 26, name: "🎣 26. صياد النقاط الماهر", icon: "🎣", type: "fish" },
            { id: 27, name: "🔑 27. فك قفل الخزنة", icon: "🔑", type: "key" },
            { id: 28, name: "🏎️ 28. رالي السيارات المجنون", icon: "🏎️", type: "car" },
            { id: 29, name: "🏰 29. حارس القلعة المشفرة", icon: "🏰", type: "castle" },
            { id: 30, name: "🃏 30. وحوش الأوراق المتطابقة", icon: "🃏", type: "match" }
        ];

        const grid = document.getElementById("grid_container");

        list_of_games.forEach(g => {
            const card = document.createElement("div");
            card.className = "game-card";
            card.innerText = g.name;
            card.onclick = () => launchGameArenaZone(g);
            grid.appendChild(card);
        });

        function launchGameArenaZone(game) {
            selectedGame = game;
            document.getElementById("main_lobby").style.display = "none";
            document.getElementById("game_arena").style.display = "block";
            document.getElementById("active_game_title").innerText = game.name;
            document.getElementById("display_box").innerText = game.icon;
            document.getElementById("score_display").innerText = "";
            document.getElementById("action_trigger_btn").disabled = false;
        }

        function exitToLobbyMenu() {
            document.getElementById("main_lobby").style.display = "block";
            document.getElementById("game_arena").style.display = "none";
            selectedGame = null;
        }

        function playActiveGameRound() {
            if (!selectedGame) return;
            const display = document.getElementById("display_box");
            const score_view = document.getElementById("score_display");
            const btn = document.getElementById("action_trigger_btn");

            btn.disabled = true;
            score_view.innerText = "جاري تدوير تروس الجولة وحساب السكور لايف الحين... ⚡";

            let spin_cnt = 0;
            const loop = setInterval(() => {
                const random_icons = ["👑", "💎", "⚡", "🚀", "🪙", "🎰", "⚽", "🎲"];
                display.innerText = random_icons[Math.floor(Math.random() * random_icons.length)];
                spin_cnt++;
                if (spin_cnt > 12) {
                    clearInterval(loop);
                    finalizeLiveGameLogic(display, score_view, btn);
                }
            }, 90);
        }

        function finalizeLiveGameLogic(display, score_view, btn) {
            const win_flag = Math.random() > 0.4; 
            let pointsWon = 0;

            if (win_flag) {
                pointsWon = Math.floor(Math.random() * 40) + 10;
                display.innerText = selectedGame.icon + "🔥";
                score_view.innerHTML = `<span style="color: #00ff00;">🏆 كفو يا برنس! فوز ساحق كسبت [ +${pointsWon} ] نقطة!</span>`;
            } else {
                display.innerText = "❌";
                score_view.innerHTML = `<span style="color: #ff3333;">❌ حظ أوفر الجولة القادمة يا غالي!</span>`;
            }

            const packet = {
                game_id: selectedGame.id,
                game_type: selectedGame.type,
                user_id: final_user_id,
                score: pointsWon
            };

            setTimeout(() => {
                WebApp.sendData(JSON.stringify(packet)); 
                btn.disabled = false;
            }, 1800);
        }
    </script>
</body>
</html>
